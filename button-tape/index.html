<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>扣带自动排版 · Button Tape</title>
  <meta name="description" content="输入布宽、扣径、间距和成品长，自动生成多种扣带排版方案图纸。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topbar">
    <div>
      <p class="brand">扣带自动排版</p>
      <p class="brand-sub">布宽 · 扣径 · 间距 · 成品长（全部 mm）→ 多种方案图纸</p>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="../gann-square/">江恩九方图</a>
      <button type="button" class="btn ghost" id="btnPrint">打印</button>
      <button type="button" class="btn primary" id="btnExportPng">导出 PNG</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel controls" aria-label="规格输入">
      <p class="panel-title">规格（mm）</p>

      <div class="examples">
        <button type="button" id="ex170" class="on" data-example="170">
          17 cm 双方案
          <small>170 · 间距 30 · 6 扣 / 5 扣</small>
        </button>
        <button type="button" id="ex150" data-example="150">
          15 cm 图例
          <small>150 · 间距 30 · 5 扣 / 4 扣</small>
        </button>
      </div>

      <label class="field">
        <span>布宽 W <span class="unit">mm（必填）</span></span>
        <input id="width" type="number" inputmode="decimal" min="1" step="0.5" value="20" />
        <div class="chips" data-target="width">
          <button type="button" data-value="15">15</button>
          <button type="button" data-value="18">18</button>
          <button type="button" data-value="20" class="on">20</button>
          <button type="button" data-value="25">25</button>
          <button type="button" data-value="30">30</button>
        </div>
      </label>

      <label class="field">
        <span>扣径 D <span class="unit">mm（必填）</span></span>
        <input id="diameter" type="number" inputmode="decimal" min="1" step="0.5" value="15" />
        <div class="chips" data-target="diameter">
          <button type="button" data-value="11.5">11.5</button>
          <button type="button" data-value="15" class="on">15</button>
          <button type="button" data-value="18">18</button>
          <button type="button" data-value="20">20</button>
          <button type="button" data-value="25">25</button>
        </div>
      </label>

      <label class="field">
        <span>钮扣间距 S <span class="unit">mm · 中心距</span></span>
        <input id="spacing" type="number" inputmode="decimal" min="1" step="0.5" value="30" />
        <div class="chips" data-target="spacing">
          <button type="button" data-value="20">20</button>
          <button type="button" data-value="25">25</button>
          <button type="button" data-value="30" class="on">30</button>
          <button type="button" data-value="40">40</button>
        </div>
      </label>

      <label class="field">
        <span>成品长 L <span class="unit">mm · 17 cm 填 170</span></span>
        <input id="length" type="number" inputmode="decimal" min="1" step="1" value="170" />
        <div class="chips" data-target="length">
          <button type="button" data-value="150">150</button>
          <button type="button" data-value="170" class="on">170</button>
          <button type="button" data-value="200">200</button>
          <button type="button" data-value="450">450</button>
          <button type="button" data-value="1200">1200</button>
        </div>
      </label>

      <label class="field">
        <span>扣数 N <span class="unit">可空 = 自动选最多扣</span></span>
        <input id="count" type="number" inputmode="numeric" min="1" step="1" placeholder="自动" />
      </label>
      <p class="hint">止口（扣中心到布边）允许 = 10 mm。自动方案只列出止口 ≤ 间距的排法，默认可点选多种效果图；手填 N 可看其它排法。</p>
      <div class="status" id="status" role="status"></div>
    </aside>

    <section class="workspace">
      <div class="panel scheme-panel">
        <div class="scheme-head">
          <h2>排版方案</h2>
          <span class="unit" id="schemeMeta"></span>
        </div>
        <div class="scheme-grid" id="schemeGrid" role="listbox" aria-label="排版方案"></div>
      </div>

      <div class="panel board">
        <h2>排版模式图</h2>
        <div class="board-scroll">
          <svg id="tapeSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="扣带排版图纸"></svg>
        </div>
        <p class="formula-line" id="formulaLine"></p>
        <p class="foot-note">标注为毫米。式子：止口 + 间距 × 循环 + 止口 = 成品长。</p>
      </div>

      <div class="panel table-wrap hidden" id="coordPanel">
        <h2>每扣中心坐标（距左边缘，mm）</h2>
        <table>
          <thead>
            <tr><th>序号</th><th>中心 X</th></tr>
          </thead>
          <tbody id="coordBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./js/layout.js"></script>
  <script src="./js/draw.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
